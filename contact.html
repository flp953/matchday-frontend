<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchday — Contact</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#181614; --paper:#F3F1EC; --lime:#C8F520; --muted:#8A8378; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--paper); color:var(--ink); font-family:'Barlow',sans-serif; }
  header { background:var(--ink); padding:18px 24px; }
  .logo { font-family:'Barlow Condensed',sans-serif; font-size:24px; font-weight:900; color:#fff; text-decoration:none; text-transform:uppercase; }
  .logo span { color:var(--lime); }
  main { max-width:780px; margin:0 auto; padding:48px 24px 80px; }
  h1 { font-family:'Barlow Condensed',sans-serif; font-size:44px; font-weight:900; text-transform:uppercase; line-height:1; margin-bottom:32px; }
  h1 em { font-style:italic; color:var(--ink); background:var(--lime); padding:0 6px; }
  a { color:var(--ink); }
  .retour { display:inline-block; margin-top:40px; font-family:'Barlow Condensed',sans-serif; font-weight:800; text-transform:uppercase; }
</style>
<!-- Vercel Web Analytics (à activer dans le dashboard Vercel > Analytics) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header><a class="logo" href="/">Match<span>day</span></a></header>
<main>
  <h1><em>Contact</em></h1>
  <p style="font-size:16px;line-height:1.7;margin-bottom:24px;">Une question sur une réservation, un remboursement, ou tu gères un five et tu veux rejoindre Matchday ? Écris-nous.</p>
  <p style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px;"><a href="mailto:hello@matchday.fr">hello@matchday.fr</a></p>
  <p style="font-size:13px;color:var(--muted);">On répond en général sous 48h.</p>
  <p style="font-size:13px;color:var(--muted);margin-top:24px;">Pour tes données personnelles (accès, suppression…) : <a href="mailto:privacy@matchday.fr">privacy@matchday.fr</a></p>

  <a class="retour" href="/">← Retour à l'accueil</a>
</main>
</body>
</html>
